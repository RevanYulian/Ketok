<button class="flex-1 py-md bg-surface-variant text-on-surface border-r border-outline-variant font-label-md flex items-center justify-center">

</button>
<button class="flex-1 py-md bg-surface-container-lowest text-on-surface-variant font-label-md flex items-center justify-center hover:bg-surface-container-low transition-colors">

</button>

<!-- Input Form Area -->
<div class="flex flex-col gap-lg mb-lg">
<!-- Email/Phone Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-on-surface-variant px-xs">Username atau Email</label>
<div class="w-full h-[56px] border border-outline-variant rounded flex items-center px-md focus-within:border-on-surface transition-colors bg-surface-container-lowest shadow-sm hover:border-outline">
<input class="w-full bg-transparent text-on-surface outline-none font-body-md placeholder:text-outline" placeholder="Masukkan username atau email" type="text">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-on-surface-variant px-xs">Kata Sandi</label>
<div class="w-full h-[56px] border border-outline-variant rounded flex items-center justify-between px-md focus-within:border-on-surface transition-colors bg-surface-container-lowest shadow-sm hover:border-outline">
<input class="w-full bg-transparent text-on-surface outline-none font-body-md placeholder:text-outline" placeholder="Masukkan kata sandi" type="password">
<button class="text-outline hover:text-on-surface transition-colors focus:outline-none">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end w-full">
<button class="font-label-sm text-on-surface-variant hover:text-on-surface hover:underline underline-offset-4 transition-all">Lupa kata sandi?</button>
</div>
</div>

<div class="relative z-10 flex flex-col gap-md mb-xl">

</div>

<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
</button>
<button class="flex items-center justify-center w-14 h-14 border border-outline-variant bg-surface-container-lowest rounded-full shadow-sm active:bg-surface-variant transition-colors">
<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.08-.46-2.07-.48-3.2 0-1.44.62-2.2.44-3.04-.35C4.28 16.8 3.3 11.23 6.3 8.16c1.28-1.3 2.76-1.5 3.9-.76 1.05.67 1.8.67 2.94 0 1.02-.6 2.7-.87 4.04.47 1.6 1.07 2.87 3.33 1.83 5.4-1.3 2.5-1.93 4.25-2.96 5.4 0 0 .1.05 0 0zM12.03 7.25c-.15-2.23 1.66-4.07 3.65-4.25.26 2.4-2.12 4.5-3.65 4.25z"></path>
</svg>
</button>
</div>
</div>
<script>
  // Add micro-interactions
  document.querySelectorAll('button').forEach(button => {
    button.addEventListener('touchstart', function() {
      this.style.transform = 'scale(0.98)';
    });
    button.addEventListener('touchend', function() {
      this.style.transform = 'scale(1)';
    });
  });

  // Simple Entrance Animation
  document.addEventListener('DOMContentLoaded', () => {
    const mainWrapper = document.querySelector('.px-margin-mobile');
    mainWrapper.style.opacity = '0';
    mainWrapper.style.transform = 'translateY(20px)';
    mainWrapper.style.transition = 'all 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
    
    requestAnimationFrame(() => {
      mainWrapper.style.opacity = '1';
      mainWrapper.style.transform = 'translateY(0)';
    });
  });
</script></main>






</body></html>
